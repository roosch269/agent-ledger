name: Bug report
description: Report something that does not work as documented.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please do **not** report security
        vulnerabilities here — see the Security policy instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what went wrong?
      placeholder: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands, with input and the output you saw (include exit codes).
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: agent-ledger version
      description: Output of `node bin/ledger.js --version`, or the commit SHA.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: v20.x
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Ubuntu 24.04, macOS 15
    validations:
      required: true
  - type: textarea
    id: model-cmd
    attributes:
      label: Model command (if relevant)
      description: >
        If the bug involves `check`, the `LEDGER_MODEL_CMD` you used. Redact any
        secrets or API keys.
    validations:
      required: false
